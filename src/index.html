<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoIT #12 HomeWork</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <form class="form">
          <label>
            <input
              type="text"
              name="search-text"
              placeholder="Search images..."
              required
            />
          </label>
          <button type="submit">Search</button>
        </form>
        <span
          id="gallery-loader"
          class="loader"
          hidden
          role="status"
          aria-live="polite"
        >
          <span class="loader-inner ball-pulse">
            <div></div>
            <div></div>
            <div></div>
          </span>
        </span>

        <ul class="gallery"></ul>
        <button class="load-more-btn is-hidden">Load more</button>
      </div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
